<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OwnTracker - All Devices</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<style>
  html, body { margin:0; height:100%; font-family: Arial, sans-serif; }
  #header { background:#2c3e50; color:#fff; padding:10px 14px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  #header h1 { font-size:18px; margin:0; }
  #header a { color:#8fd0ff; }
  #map { height:calc(100% - 46px); }
  button { padding:6px 10px; border:0; border-radius:4px; cursor:pointer; background:#3498db; color:#fff; }
  button.danger { background:#c0392b; }
  #list { position:fixed; top:58px; right:10px; z-index:1000; width:280px; max-height:55%; overflow-y:auto; background:#fff; border-radius:4px; box-shadow:0 0 10px rgba(0,0,0,.25); padding:8px; }
  .row { display:flex; align-items:center; gap:8px; padding:6px 4px; border-bottom:1px solid #eee; font-size:13px; }
  .row .name { flex:1; cursor:pointer; }
  .row small { color:#666; display:block; }
  .dot { width:12px; height:12px; border-radius:50%; flex:none; }
  .row button { padding:3px 7px; font-size:12px; }
  .row a { font-size:12px; }
</style>
</head>
<body>
<div id="header">
  <h1>OwnTracker - All Devices</h1>
  <a href="/">My location</a>
  <button id="fit">Fit all</button>
  <button id="clearAll" class="danger">Clear all records</button>
  <span id="info"></span>
</div>
<div id="map"></div>
<div id="list">Loading...</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const map = L.map('map').setView([0, 0], 2);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap contributors', maxZoom: 19 }).addTo(map);
let layer = L.layerGroup().addTo(map), bounds = {}, firstFit = true;
const color = id => { let h = 0; for (const c of id) h = (h * 31 + c.charCodeAt(0)) % 360; return `hsl(${h},75%,42%)`; };
const short = id => id.replace(/^device-\d+-/, '');

async function refresh() {
  const devices = await (await fetch('/api/devices')).json();
  layer.clearLayers(); bounds = {};
  const list = document.getElementById('list');
  list.innerHTML = devices.length ? '' : 'No devices yet. Start tracking from a phone or laptop.';
  const h = await (await fetch('/api/health')).json();
  document.getElementById('info').textContent = devices.length + ' device(s), server ' + h.instance + ', ' + location.host;
  for (const d of devices) {
    const pts = (await (await fetch('/api/location/' + encodeURIComponent(d.id))).json());
    if (!pts.length) continue;
    const ll = pts.map(p => [p.latitude, p.longitude]), c = color(d.id), last = pts[pts.length - 1];
    L.polyline(ll, { color: c, weight: 4, opacity: 0.85 }).addTo(layer);
    L.circleMarker(ll[0], { radius: 5, color: '#1a9850', fillColor: '#fff', fillOpacity: 1 }).bindPopup('Start of ' + short(d.id)).addTo(layer);
    L.circleMarker(ll[ll.length - 1], { radius: 9, color: c, fillColor: c, fillOpacity: 1 })
      .bindTooltip(short(d.id), { permanent: true, direction: 'top' })
      .bindPopup('Device ' + d.id + '<br>Last update: ' + new Date(last.timestamp).toLocaleString()).addTo(layer);
    bounds[d.id] = L.latLngBounds(ll);
    const row = document.createElement('div'); row.className = 'row';
    row.innerHTML = `<span class="dot" style="background:${c}"></span><div class="name"><b>${short(d.id)}</b><small>${d.points} pts, ${d.lastSeen}</small></div>` +
      `<a href="/3d?device=${encodeURIComponent(d.id)}">3D</a><button class="danger" title="Clear this device">Clear</button>`;
    row.querySelector('.name').onclick = () => map.fitBounds(bounds[d.id].pad(0.3), { maxZoom: 18 });
    row.querySelector('button').onclick = () => clearRecords(d.id);
    list.appendChild(row);
  }
  if (firstFit && Object.keys(bounds).length) { fitAll(); firstFit = false; }
}
function fitAll() {
  const all = Object.values(bounds); if (!all.length) return;
  const b = all.reduce((acc, x) => acc.extend(x), L.latLngBounds(all[0].getSouthWest(), all[0].getNorthEast()));
  map.fitBounds(b.pad(0.2), { maxZoom: 18 });
}
async function clearRecords(id) {
  const msg = id ? 'Clear all records for device ' + short(id) + '?' : 'Clear ALL records for ALL devices? This cannot be undone.';
  if (!confirm(msg)) return;
  const url = id ? '/api/location/' + encodeURIComponent(id) : '/api/location';
  const call = key => fetch(url, { method: 'DELETE', headers: key ? { 'x-admin-key': key } : {} });
  let res = await call(sessionStorage.getItem('adminKey'));
  if (res.status === 401) {
    const key = prompt('Admin key:');
    if (!key) return;
    res = await call(key);
    if (res.ok) sessionStorage.setItem('adminKey', key);
  }
  if (!res.ok) { alert(res.status === 401 ? 'Wrong admin key.' : 'Could not clear records.'); return; }
  refresh();
}
document.getElementById('fit').onclick = fitAll;
document.getElementById('clearAll').onclick = () => clearRecords(null);
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
